[project]
name = "local-pipeline"
version = "0.1.0"
description = "A reproducible local-first Python pipeline scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
project = "project_core.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.13,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_core"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
