[project]
name = "ai-workspace-foundation"
timezone = "Asia/Tokyo"

[paths]
raw = "data/raw"
processed = "data/processed"
outputs = "outputs"
work = "work"

[execution]
mode = "cloud"
local_required = false
fail_on_missing_input = true
write_run_manifest = true

[integrations.google_drive]
enabled = false
root_folder_name = ""
root_folder_id = ""
system_brief_id = ""

[integrations.github]
enabled = true
repository = "Mitsuru-sato37/ai-workspace-foundation"
